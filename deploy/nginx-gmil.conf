# /etc/nginx/sites-available/gmil.nedir.com.br — preview da LP da GMIL (Next.js em 127.0.0.1:3020).
# Só HTTP aqui: o certbot --nginx acrescenta o HTTPS e o redirecionamento.
upstream gmil_lp {
    server 127.0.0.1:3020;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name gmil.nedir.com.br;
    client_max_body_size 64k;

    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://gmil_lp;
    }
}
